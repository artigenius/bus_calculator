:root{
  /* Changellenge >> brandbook, сентябрь 2025 */
  --ink:#121217;         /* никогда чистый #000000 */
  --ink-2:#121217;
  --red:#E71026;         /* бренд-акцент, максимум 10% площади макета */
  --red-dark:#b80c1d;
  --light-red:#FFEAEC;   /* акцентные плашки */
  --light-teal:#6CB3CC;
  --dark-blue:#004F6B;
  --gray-100:#F1F1F1;    /* фон */
  --gray-200:#EAEAEA;
  --gray-300:#DFE3E4;    /* вторичные блоки, карточки */
  --gray-500:#8A8F98;
  --gray-600:#54585F;
  --white:#FFFFFF;
  --radius:28px;
  --radius-sm:18px;
  --shadow:0 1px 2px rgba(18,18,23,0.06), 0 8px 24px rgba(18,18,23,0.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Factor A', Arial, Helvetica, sans-serif;
  background:var(--gray-100);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
#app{max-width:1180px;margin:0 auto;padding:0 24px 80px;}

/* ---------- Header ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:22px 0;border-bottom:1px solid var(--gray-300);margin-bottom:28px;
}
.topbar .brand{display:flex;align-items:center;gap:12px;}
.topbar .brand .brand-logo-svg{height:17px;width:auto;display:block;}
.brand-sign{position:absolute;top:22px;right:24px;opacity:.9;pointer-events:none;}
.brand-sign svg{display:block;}
@media (max-width:600px){.brand-sign{display:none;}}
.eyebrow{
  font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--red);
  font-weight:bold;margin-bottom:6px;
}
h1{font-size:26px;margin:0 0 6px;letter-spacing:-.01em;font-weight:900;line-height:1.2;}
.subtitle{color:var(--gray-600);font-size:15px;margin:0 0 8px;max-width:640px;line-height:1.5;font-weight:400;}

/* ---------- Effect explainer cards ---------- */
.explainer-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:18px 0 28px;}
.explainer-card{
  background:var(--white);border:1px solid var(--gray-300);border-radius:var(--radius-sm);padding:16px 18px;
}
.explainer-card .num{
  display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;
  background:var(--gray-200);color:var(--ink-2);font-size:11.5px;font-weight:bold;margin-bottom:10px;
}
.explainer-card h4{margin:0 0 6px;font-size:14.5px;}
.explainer-card p{margin:0;font-size:12.8px;color:var(--gray-600);line-height:1.5;}

/* ---------- Calculator layout ---------- */
.calc-grid{display:grid;grid-template-columns:0.72fr 1fr;gap:20px;align-items:start;}
@media (max-width:900px){.calc-grid{grid-template-columns:1fr;}}

.panel{background:var(--white);border:1px solid var(--gray-300);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);}
.panel h2{font-size:16px;margin:0 0 4px;}
.panel .hint{font-size:12.5px;color:var(--gray-600);margin:0 0 18px;}

.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px;color:var(--ink-2);}
.field label .help{
  display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;
  background:var(--gray-300);color:var(--gray-600);font-size:10px;font-weight:bold;margin-left:6px;
  cursor:help;font-family:Georgia,serif;vertical-align:middle;
}
.field .input-wrap{display:flex;align-items:center;border:1.5px solid var(--gray-300);border-radius:14px;overflow:hidden;background:var(--white);transition:.12s;}
.field .input-wrap:focus-within{border-color:var(--ink-2);}
.field input{
  flex:1;border:none;outline:none;padding:11px 12px;font-size:14.5px;font-family:inherit;color:var(--ink);
  min-width:0;background:transparent;
}
.field .unit{padding:0 12px;color:var(--gray-600);font-size:13px;white-space:nowrap;border-left:1px solid var(--gray-300);align-self:stretch;display:flex;align-items:center;background:var(--gray-100);}
.field .tip{font-size:11.5px;color:var(--gray-500);margin-top:5px;line-height:1.4;display:none;}
.field .tip.show{display:block;}

.advanced-toggle{
  border:none;background:none;color:var(--red);font-size:13px;font-weight:bold;cursor:pointer;
  padding:6px 0;display:flex;align-items:center;gap:6px;font-family:inherit;margin-top:4px;
}
.advanced-toggle svg{width:11px;height:11px;transition:.15s;}
.advanced-toggle.open svg{transform:rotate(180deg);}
.advanced-fields{display:none;padding-top:6px;border-top:1px solid var(--gray-200);margin-top:10px;}
.advanced-fields.show{display:block;}

.reset-btn{
  width:100%;margin-top:6px;padding:11px;border-radius:14px;border:1.5px solid var(--gray-300);
  background:var(--white);color:var(--ink-2);font-size:13.5px;font-weight:bold;cursor:pointer;font-family:inherit;
}
.reset-btn:hover{border-color:var(--ink-2);background:var(--gray-100);}

/* ---------- Results ---------- */
.result-hero{
  position:relative;
  background:var(--ink-2);border-radius:var(--radius);padding:26px 26px 22px;color:var(--white);margin-bottom:14px;
  box-shadow:var(--shadow);
}
.result-hero .label{font-size:13px;color:#B7BCC6;margin-bottom:8px;font-weight:bold;text-transform:uppercase;letter-spacing:.04em;}
.result-hero .value{font-size:38px;font-weight:bold;letter-spacing:-.01em;line-height:1.1;}
.result-hero .sub{font-size:12.5px;color:#9BA1AD;margin-top:8px;}

.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;}
.kpi-card{background:var(--white);border:1px solid var(--gray-300);border-radius:var(--radius-sm);padding:16px 18px;}
.kpi-card .label{font-size:12px;color:var(--gray-600);font-weight:bold;margin-bottom:6px;}
.kpi-card .value{font-size:22px;font-weight:bold;color:var(--ink-2);}
.kpi-card.roi .value{color:var(--red);}

.breakdown h3{font-size:14.5px;margin:0 0 12px;}
.effect-card{
  background:var(--white);border:1px solid var(--gray-300);border-radius:var(--radius-sm);margin-bottom:10px;overflow:hidden;
}
.effect-head{
  display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;gap:10px;
}
.effect-head .left{display:flex;align-items:center;gap:12px;min-width:0;}
.effect-bar-wrap{flex:none;width:5px;align-self:stretch;border-radius:3px;background:var(--gray-200);position:relative;min-height:38px;overflow:hidden;}
.effect-bar-fill{position:absolute;left:0;bottom:0;width:100%;background:var(--red);border-radius:3px;}
.effect-head .txt{min-width:0;}
.effect-head .txt .t{font-size:13.5px;font-weight:bold;color:var(--ink-2);}
.effect-head .txt .v{font-size:16px;font-weight:bold;margin-top:2px;}
.effect-head .toggle{
  font-size:12px;color:var(--red);font-weight:bold;white-space:nowrap;display:flex;align-items:center;gap:5px;flex:none;
}
.effect-head .toggle svg{width:10px;height:10px;transition:.15s;}
.effect-card.open .toggle svg{transform:rotate(180deg);}
.effect-body{display:none;padding:0 16px 18px;border-top:1px solid var(--gray-200);}
.effect-card.open .effect-body{display:block;padding-top:14px;}
.effect-body .block{margin-bottom:12px;}
.effect-body .block:last-child{margin-bottom:0;}
.effect-body .block h5{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--gray-500);margin:0 0 6px;font-weight:bold;}
.effect-body .block p{margin:0;font-size:13px;line-height:1.55;color:var(--ink);}
.effect-body .datarow{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--gray-200);}
.effect-body .datarow:last-child{border-bottom:none;}
.effect-body .datarow .k{color:var(--gray-600);}
.effect-body .datarow .v{font-weight:bold;color:var(--ink-2);}
.effect-body .source{font-size:12px;color:var(--gray-500);font-style:italic;line-height:1.5;}

.footnote{font-size:12px;color:var(--gray-500);margin-top:22px;line-height:1.6;}
.footnote b{color:var(--gray-600);}

@media (max-width:480px){
  #app{padding:0 16px 48px;}
  .calc-grid{grid-template-columns:minmax(0,1fr);}
  .panel{padding:18px;}
  .result-hero{padding:22px 20px;}
  .result-hero .value{font-size:30px;}
  .kpi-row{grid-template-columns:repeat(2,minmax(0,1fr));}
  .kpi-card{padding:14px 12px;}
  .kpi-card .value{font-size:20px;}
  .effect-head{flex-wrap:wrap;}
  .effect-head .left{flex:1 1 100%;}
  .effect-head .toggle{margin-left:17px;}
  .effect-body .datarow{gap:12px;flex-wrap:wrap;}
  .effect-body .source{overflow-wrap:anywhere;}
}

</style>
</head>

<div id="app">
  <div class="topbar">
    <div class="brand">

    </div>
  </div>

  <main id="screenCalc"></main>
  <noscript>Для работы калькулятора включите JavaScript в браузере.</noscript>
</div>

<script>
/* ============================================================
   BRAND ASSETS
   ============================================================ */

/* ============================================================
   FORMATTERS
   ============================================================ */
function fmtMoney(n){
  if(n===null||n===undefined||isNaN(n)) return "—";
  const sign = n<0 ? "-" : "";
  const abs = Math.abs(n);
  if(abs >= 1e6){
    return sign + (abs/1e6).toLocaleString('ru-RU',{minimumFractionDigits:1,maximumFractionDigits:1}) + " млн ₽";
  }
  if(abs >= 1e3){
    return sign + (abs/1e3).toLocaleString('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:1}) + " тыс ₽";
  }
  return sign + Math.round(abs).toLocaleString('ru-RU') + " ₽";
}
function fmtMoneyFull(n){
  return Math.round(n).toLocaleString('ru-RU') + " ₽";
}
function fmtNum(n, decimals){
  decimals = decimals||0;
  return n.toLocaleString('ru-RU',{minimumFractionDigits:decimals,maximumFractionDigits:decimals});
}
function fmtPercent(x, decimals){
  decimals = decimals===undefined?1:decimals;
  return (x*100).toLocaleString('ru-RU',{minimumFractionDigits:decimals,maximumFractionDigits:decimals}) + "%";
}
function fmtRoi(x){
  return Math.round(x*100).toLocaleString('ru-RU') + "%";
}

/* ============================================================
   PRODUCT MODELS
   Все формулы и коэффициенты воспроизводят Excel-модель
   "Эконом. эффективность 2026" 1:1 (проверено на значениях по умолчанию).
   ============================================================ */
const PRODUCTS = {};
PRODUCTS.evp = {
  id:'evp',
  tag:'03',
  name:'EVP (активация)',
  cardDesc:'Активация ценностного предложения работодателя: снижение переплаты новым сотрудникам, снижение текучести, стоимости привлечения кандидатов и ROI проекта.',
  tagline:'Активация EVP',
  intro:'Оцените финансовую ценность активации EVP / бренда работодателя — с учётом стоимости проекта и ROI.',
  effectCards:[
    {title:'Меньше переплаты новым сотрудникам', text:'Слабый бренд работодателя вынуждает переплачивать при найме — сильный EVP это снижает.'},
    {title:'Снижение текучести', text:'Сильный EVP снижает текучесть — компании нужно меньше замещающих наймов.'},
    {title:'Дешевле привлечение кандидатов', text:'Более сильный бренд работодателя снижает стоимость привлечения кандидатов.'}
  ],
  hasROI:true,
  inputs:[
    {id:'headcount', label:'Количество сотрудников компании', unit:'чел.', def:10000, group:'main', step:100},
    {id:'avgSalaryNet', label:'Средняя зарплата (после вычета налогов)', unit:'₽/мес', def:110000, group:'main', step:1000},
    {id:'turnoverRate', label:'Текущая годовая текучесть', unit:'%', def:20, group:'main', step:1, percent:true},
    {id:'programCost', label:'Стоимость проекта Changellenge >>', unit:'₽', def:7000000, group:'main', step:100000},
    {id:'activationCost', label:'Примерные затраты на активацию EVP', unit:'₽', def:20000000, group:'main', step:100000,
      help:'Ориентировочные внутренние затраты компании на активацию EVP (команда, коммуникации, мероприятия и т.д.)'},

    {id:'authenticityIndex', label:'Индекс аутентичности', unit:'%', def:30, group:'advanced', step:1, percent:true,
      help:'Понижающий коэффициент, который делает расчёт экономического эффекта более консервативным и реалистичным'}
  ],
  compute(v){
    const OVERPAY=0.03, EXTRA=0.52, TURNOVER_RED_SHARE=0.23, HIRE_RATE=0.22, EB_RED=0.43/3, HIRE_SHARE=0.10;
    const turnover = v.turnoverRate/100;
    const authIdx = v.authenticityIndex/100;

    const newHires = v.headcount*turnover;
    const annualSalary = v.avgSalaryNet*12;
    const payrollNewHires = newHires*annualSalary;
    const overpay = payrollNewHires*OVERPAY;
    const e1 = overpay*(1+EXTRA);

    const reducedTurnover = turnover*(1-TURNOVER_RED_SHARE);
    const fewerHires = v.headcount*(turnover-reducedTurnover);
    const hireCost = v.avgSalaryNet*12*HIRE_RATE;
    const e2 = fewerHires*hireCost;

    const hireCostAnnual = annualSalary*HIRE_RATE;
    const ebReduction = hireCostAnnual*EB_RED;
    const annualHires = v.headcount*HIRE_SHARE;
    const e3 = ebReduction*annualHires;

    const rawTotal = e1+e2+e3;
    const total = rawTotal*authIdx;
    const cost = v.programCost+v.activationCost;
    const roi = (total-cost)/cost;

    return {
      total, cost, roi,
      rawTotal, authIdx,
      effects:[
        {id:'e1', label:'Экономия на переплате новым сотрудникам', amount:e1*authIdx, rawAmount:e1,
          logic:'Слабый бренд работодателя вынуждает переплачивать при найме новых сотрудников. Развитие EVP снижает эту переплату.',
          data:[
            {k:'Новых сотрудников в год (текучесть × численность)', v:fmtNum(newHires)+' чел.'},
            {k:'ФОТ новых сотрудников в год', v:fmtMoneyFull(payrollNewHires)},
            {k:'Переплата из-за слабого бренда (3%)', v:fmtMoneyFull(overpay)}
          ],
          result:'До индекса аутентичности: '+fmtMoneyFull(e1),
          source:'Wade Burgess, Harvard Business Review: компании со слабым брендом работодателя переплачивают сотрудникам примерно 10% заработной платы. Модель использует консервативную оценку — в 3 раза меньше (3%).'
        },
        {id:'e2', label:'Эффект от снижения текучести', amount:e2*authIdx, rawAmount:e2,
          logic:'Сильный EVP снижает текучесть персонала — компании требуется меньше замещающих наймов.',
          data:[
            {k:'Текучесть до проекта', v:fmtPercent(turnover,1)},
            {k:'Текучесть после (снижение на 23%)', v:fmtPercent(reducedTurnover,1)},
            {k:'Предотвращено наймов на замену', v:fmtNum(fewerHires)+' чел.'},
            {k:'Стоимость найма одного сотрудника', v:fmtMoneyFull(hireCost)}
          ],
          result:'До индекса аутентичности: '+fmtMoneyFull(e2),
          source:'По данным Gartner, компании с сильным EVP снижают годовую текучесть более чем на 69%. Модель использует консервативную оценку — в 3 раза меньше (23%).'
        },
        {id:'e3', label:'Экономия на привлечении кандидатов', amount:e3*authIdx, rawAmount:e3,
          logic:'Более сильный бренд работодателя снижает стоимость привлечения кандидатов на открытом рынке труда.',
          data:[
            {k:'Стоимость найма одного сотрудника в год', v:fmtMoneyFull(hireCostAnnual)},
            {k:'Снижение стоимости привлечения после EVP', v:fmtPercent(EB_RED,1)+' → '+fmtMoneyFull(ebReduction)},
            {k:'Объём найма специалистов в год (10% от численности)', v:fmtNum(annualHires)+' чел.'}
          ],
          result:'До индекса аутентичности: '+fmtMoneyFull(e3),
          source:'Согласно LinkedIn, компании с сильным брендом работодателя экономят на поиске и привлечении кандидатов до 43%. Модель использует консервативную оценку — в 3 раза меньше (14,3%).'
        }
      ],
      costBreakdown:[
        {k:'Стоимость проекта Changellenge >>', v:fmtMoneyFull(v.programCost)},
        {k:'Примерные затраты на активацию EVP', v:fmtMoneyFull(v.activationCost)}
      ]
    };
  }
};


/* ============================================================
   STATE
   ============================================================ */
const currentProduct = PRODUCTS['evp'];
let values = {};
let openEffects = {};
let advancedOpen = false;

/* ============================================================
   RENDER: CALCULATOR
   ============================================================ */
function buildFieldHtml(f){
  const val = values[f.id];
  return `
    <div class="field">
      <label for="in_${f.id}">${f.label}${f.help?`<span class="help" data-tip="${f.id}">?</span>`:''}</label>
      <div class="input-wrap">
        <input type="text" inputmode="decimal" id="in_${f.id}" data-id="${f.id}" value="${fmtInputValue(val)}"
          onfocus="this.select()" oninput="handleInput('${f.id}', this.value)">
        <span class="unit">${f.unit}</span>
      </div>
      ${f.help?`<div class="tip" id="tip_${f.id}">${f.help}</div>`:''}
    </div>
  `;
}
function fmtInputValue(v){
  // show integers cleanly, decimals with comma
  if(Number.isInteger(v)) return v.toLocaleString('ru-RU');
  return v.toLocaleString('ru-RU',{maximumFractionDigits:2});
}
function parseInputValue(s){
  const cleaned = String(s).replace(/\s| /g,'').replace(',','.');
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}

function renderCalc(){
  const p = currentProduct;
  const mainFields = p.inputs.filter(f=>f.group==='main');
  const advFields = p.inputs.filter(f=>f.group==='advanced');

  const el = document.getElementById('screenCalc');
  el.innerHTML = `
    <div class="eyebrow">${p.tag} · Продукт Changellenge &gt;&gt;</div>
    <h1>${p.name}</h1>
    <p class="subtitle">${p.intro}</p>

    <div class="explainer-row">
      ${p.effectCards.map((c,i)=>`
        <div class="explainer-card">
          <div class="num">${i+1}</div>
          <h4>${c.title}</h4>
          <p>${c.text}</p>
        </div>
      `).join('')}
    </div>

    <div class="calc-grid">
      <div class="panel">
        <h2>Расскажите немного о компании и проекте</h2>
        <p class="hint">Результат пересчитывается сразу при изменении любого значения.</p>
        <div id="mainFields">${mainFields.map(buildFieldHtml).join('')}</div>
        ${advFields.length?`
          <button class="advanced-toggle" id="advToggle" onclick="toggleAdvanced()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>
            Настроить расчёт подробнее
          </button>
          <div class="advanced-fields" id="advFields">${advFields.map(buildFieldHtml).join('')}</div>
        `:''}
        <button class="reset-btn" onclick="resetDefaults()">Вернуть исходные значения</button>
      </div>

      <div id="resultsCol"></div>
    </div>

    <div class="footnote"><b>Как считается:</b> расчёт основан на модели Changellenge &gt;&gt; «Экономическая эффективность 2026». Внутренние рыночные бенчмарки и исследовательские коэффициенты зафиксированы в модели и не выводятся как отдельные поля ввода — их можно посмотреть в разделе «Как считается?» под каждым эффектом.</div>
  `;

  // attach tooltip toggles
  p.inputs.forEach(f=>{
    if(f.help){
      const help = el.querySelector(`.help[data-tip="${f.id}"]`);
      if(help){
        help.addEventListener('click', ()=>{
          document.getElementById('tip_'+f.id).classList.toggle('show');
        });
      }
    }
  });

  renderResults();
}

function toggleAdvanced(){
  advancedOpen = !advancedOpen;
  document.getElementById('advFields').classList.toggle('show', advancedOpen);
  document.getElementById('advToggle').classList.toggle('open', advancedOpen);
}

function handleInput(id, raw){
  values[id] = parseInputValue(raw);
  renderResults();
}

function resetDefaults(){
  advancedOpen = false;
  openEffects = {};
  currentProduct.inputs.forEach(f=>{ values[f.id] = f.def; });
  renderCalc();
}

function renderResults(){
  const p = currentProduct;
  const r = p.compute(values);
  const col = document.getElementById('resultsCol');

  const maxAmount = Math.max(...r.effects.map(e=>Math.abs(e.amount)), 1);

  let kpiHtml = '';
  if(p.hasROI){
    kpiHtml = `
      <div class="kpi-row">
        <div class="kpi-card"><div class="label">Затраты</div><div class="value">${fmtMoney(r.cost)}</div></div>
        <div class="kpi-card roi"><div class="label">ROI за 1 год</div><div class="value">${fmtRoi(r.roi)}</div></div>
      </div>
    `;
  }

  col.innerHTML = `
    <div class="result-hero">
      <div class="brand-sign" aria-hidden="true"><svg width="30" height="17" viewBox="0 0 262 150" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M112.366 0H187.037L261.624 74.6348L187.037 149.27H112.366L187.037 74.6348L112.366 0ZM74.5868 0L149.258 74.6348L74.5868 149.27H0L74.5868 74.6348L0 0H74.5868Z" fill="white"/></svg></div>
      <div class="label">Расчётный экономический эффект</div>
      <div class="value">${fmtMoney(r.total)}</div>
      <div class="sub">${p.hasROI ? 'в год, с учётом затрат на проект ниже' : 'в год · без учёта отдельного расчёта ROI — в исходной модели нет стоимости проекта для этого продукта'}</div>
    </div>
    ${kpiHtml}
    <div class="breakdown">
      <h3>Из чего складывается эффект</h3>
      ${r.effects.map(e=>{
        const isOpen = !!openEffects[e.id];
        const barPct = Math.max(6, Math.round(Math.abs(e.amount)/maxAmount*100));
        return `
        <div class="effect-card ${isOpen?'open':''}" id="card_${e.id}">
          <div class="effect-head" onclick="toggleEffect('${e.id}')">
            <div class="left">
              <div class="effect-bar-wrap"><div class="effect-bar-fill" style="height:${barPct}%"></div></div>
              <div class="txt">
                <div class="t">${e.label}</div>
                <div class="v">${fmtMoney(e.amount)}</div>
              </div>
            </div>
            <div class="toggle">Как считается?
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>
            </div>
          </div>
          <div class="effect-body">
            <div class="block"><h5>Логика</h5><p>${e.logic}</p></div>
            <div class="block"><h5>Использованные данные</h5>
              ${e.data.map(d=>`<div class="datarow"><span class="k">${d.k}</span><span class="v">${d.v}</span></div>`).join('')}
            </div>
            <div class="block"><h5>Результат</h5><p>${e.result}</p></div>
            <div class="block"><h5>Источник</h5><p class="source">${e.source}</p></div>
          </div>
        </div>
        `;
      }).join('')}
    </div>
    ${p.id==='evp' ? `
      <div class="effect-card" id="card_auth">
        <div class="effect-head" onclick="toggleEffect('auth')">
          <div class="left">
            <div class="effect-bar-wrap"><div class="effect-bar-fill" style="height:100%;background:var(--ink-2);"></div></div>
            <div class="txt">
              <div class="t">Индекс аутентичности</div>
              <div class="v">× ${fmtPercent(r.authIdx,0)}</div>
            </div>
          </div>
          <div class="toggle">Как считается?
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>
        <div class="effect-body">
          <div class="block"><h5>Логика</h5><p>Индекс аутентичности — понижающий коэффициент, который применяется к сумме всех эффектов EVP, чтобы сделать модель более консервативной и реалистичной.</p></div>
          <div class="block"><h5>Использованные данные</h5>
            <div class="datarow"><span class="k">Сумма эффектов до применения индекса</span><span class="v">${fmtMoneyFull(r.rawTotal)}</span></div>
            <div class="datarow"><span class="k">Индекс аутентичности</span><span class="v">${fmtPercent(r.authIdx,0)}</span></div>
          </div>
          <div class="block"><h5>Результат</h5><p>Итоговый эффект = ${fmtMoneyFull(r.rawTotal)} × ${fmtPercent(r.authIdx,0)} = ${fmtMoneyFull(r.total)}</p></div>
        </div>
      </div>
    ` : ''}
    ${p.hasROI ? `
      <div class="effect-card" id="card_cost">
        <div class="effect-head" onclick="toggleEffect('cost')">
          <div class="left">
            <div class="effect-bar-wrap"><div class="effect-bar-fill" style="height:100%;background:var(--gray-600);"></div></div>
            <div class="txt">
              <div class="t">Из чего складываются затраты</div>
              <div class="v">${fmtMoney(r.cost)}</div>
            </div>
          </div>
          <div class="toggle">Как считается?
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>
        <div class="effect-body">
          <div class="block"><h5>Состав затрат</h5>
            ${r.costBreakdown.map(d=>`<div class="datarow"><span class="k">${d.k}</span><span class="v">${d.v}</span></div>`).join('')}
          </div>
        </div>
      </div>
    ` : ''}
  `;

  ['e1','e2','e3','e4','auth','cost'].forEach(id=>{
    const c = document.getElementById('card_'+id);
    if(c) c.classList.toggle('open', !!openEffects[id]);
  });
}

function toggleEffect(id){
  openEffects[id] = !openEffects[id];
  const c = document.getElementById('card_'+id);
  if(c) c.classList.toggle('open', openEffects[id]);
}

/* ============================================================
   INIT
   ============================================================ */
currentProduct.inputs.forEach(f=>{ values[f.id] = f.def; });
renderCalc();
</script>
</body>
</html>
